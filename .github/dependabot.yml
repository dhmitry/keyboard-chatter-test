version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      patch:
        update-types:
          - "patch"
      minor:
        update-types:
          - "minor"
      major:
        update-types:
          - "major"
    ignore:
      - dependency-name: "@types/node"
        versions:
          - "25.x"
      - dependency-name: "typescript"
        versions:
          - "7.x"
      - dependency-name: "eslint"
        versions:
          - "10.x"
